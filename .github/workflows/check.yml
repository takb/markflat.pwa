name: Check

# Lint, type check, unit tests with coverage, build, browser tests, audit; the API's own checks. Runs on pull requests
# and on pushes to other branches; on main, deploy.yml runs it before deploying.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24, install dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # PHP as on the host: the API, and the browser tests' server.
      - name: Set up PHP 8.5 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: API (backend v2) — install, code style, PHPStan, PHPUnit, audit
        working-directory: api
        run: |
          composer install --no-interaction --no-progress
          composer check
          composer audit

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm coverage

      - name: Type check and build
        run: pnpm build

      - name: Install Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm e2e

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Runtime dependencies only; the showdown advisories are waived in pnpm-workspace.yaml.
      - name: Audit
        run: pnpm audit --prod

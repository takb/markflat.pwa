name: Build and Deploy to SFTP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # pnpm in the version package.json pins ("packageManager"), Node 24, the store cached
    # on the lockfile's hash, then `pnpm install --frozen-lockfile` (fails without a lockfile).
    - name: Set up pnpm and Node.js 24, install dependencies
      uses: pnpm/setup@v3
      with:
        runtime: node@24
        cache: true
        require-lockfile: true

    - name: Build project
      run: pnpm build --base /markflat/

    - name: Copy PHP files to dist
      run: cp *.php ./dist/ 2>/dev/null || echo "No PHP files found in root directory"

    - name: Deploy to SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.SFTP_SERVER }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        local_path: './dist/*'
        remote_path: ${{ secrets.SFTP_PATH }}
        sftp_only: true
name: Build and deploy

# main goes to markflat.laotravez.de. Until the switch-over at the end of the modernisation
# (vault: markflat.pwa/Plan — modernisation) the whole site sits behind a password: the
# current songbook.php is not fit for the open web, and it shares its webspace with
# laotravez.de.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what rclone would change on the server'
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm in the version package.json pins ("packageManager"), Node 24, the store cached
      # on the lockfile's hash, then `pnpm install --frozen-lockfile` (fails without a lockfile).
      - name: Set up pnpm and Node.js 24, install dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Set up PHP 8.5 (as on the host) and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      # The site is the subdomain's root; the app calls songbook.php next to itself. The new
      # API (api/, backend v2) goes to api/: index.php and .htaccess served, its code in api/lib/
      # denied to the web.
      - name: Build
        run: |
          pnpm build
          cp songbook.php dist/
          composer install --working-dir=api --no-dev --optimize-autoloader --no-interaction --no-progress
          mkdir -p dist/api/lib
          cp api/public/index.php api/public/.htaccess dist/api/
          cp -r api/src api/vendor dist/api/lib/
          printf '%s\n' 'Require all denied' > dist/api/lib/.htaccess

      # Everything below needs the repository variable DEPLOY_ENABLED = "true" and these
      # secrets (Settings -> Secrets and variables -> Actions); they are new names, so nothing
      # here can reach the old genkidelic.de host:
      #   MARKFLAT_SFTP_HOST, MARKFLAT_SFTP_USER, MARKFLAT_SFTP_PASS   the laotravez.de login
      #   MARKFLAT_WEBROOT    absolute path of the subdomain's webroot on the server (as
      #                       laotravez's SERVER_DIR, found with a one-off <?php echo __DIR__;)
      #   MARKFLAT_READ_KEY_SHA256  the API's read key (hash), and
      #   MARKFLAT_WRITE_KEYS       one "name sha256" line per writer; both made with
      #     php api/bin/new-key.php <name>    (name "read" for the read key)
      # and the repository VARIABLE MARKFLAT_ADMIN: the writer who manages keys in the app (D14),
      # one of the names in MARKFLAT_WRITE_KEYS. Keys made in the app live in data/.keys.json.
      #   MARKFLAT_HTPASSWD   the login line, made with
      #     gh secret set MARKFLAT_HTPASSWD --repo takb/markflat.pwa --body "markflat:$(openssl passwd -apr1)"
      # The paths are secrets, not variables, so they stay masked in this public repo's logs.
      # Without the password the run stops rather than publish an open site.
      - name: Server configuration and password
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          HTPASSWD: ${{ secrets.MARKFLAT_HTPASSWD }}
          WEBROOT: ${{ secrets.MARKFLAT_WEBROOT }}
          READ_KEY: ${{ secrets.MARKFLAT_READ_KEY_SHA256 }}
          WRITE_KEYS: ${{ secrets.MARKFLAT_WRITE_KEYS }}
          ADMIN: ${{ vars.MARKFLAT_ADMIN }}
        run: |
          [ -n "$HTPASSWD" ] || { echo "::error::secret MARKFLAT_HTPASSWD is not set"; exit 1; }
          [ -n "$WEBROOT" ] || { echo "::error::secret MARKFLAT_WEBROOT is not set"; exit 1; }
          # The songs live in data/ inside the webroot: the host's PHP sees nothing outside its
          # own webroot. data/.htaccess (from public/) denies every request, and so does the
          # rule below in case that file is ever missing.
          # The API's keys (hashes only). Without them the API answers every request with 401;
          # songbook.php (the old API, until the app moves over) keeps its own keys.
          READ_KEY=$(printf '%s' "$READ_KEY" | tr -d '[:space:]')
          [ -n "$READ_KEY" ] || echo "::warning::secret MARKFLAT_READ_KEY_SHA256 is not set: the new API lets nobody in"
          [ -z "$READ_KEY" ] || [[ "$READ_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::secret MARKFLAT_READ_KEY_SHA256 must be just the 64-character hash"; exit 1; }
          export READ_KEY
          php -r '
            $writers = [];
            foreach (preg_split("/\R/", trim((string) getenv("WRITE_KEYS"))) as $line) {
                if (preg_match("/^\s*([a-z0-9_-]{1,40})\s+([0-9a-fA-F]{64})\s*$/", $line, $m)) {
                    $writers[$m[1]] = strtolower($m[2]);
                } elseif (trim($line) !== "") {
                    fwrite(STDERR, "::error::secret MARKFLAT_WRITE_KEYS: every line must be \"name sha256\"\n");
                    exit(1);
                }
            }
            $admin = trim((string) getenv("ADMIN"));
            if ($admin !== "" && !isset($writers[$admin])) {
                fwrite(STDERR, "::error::variable MARKFLAT_ADMIN names no writer in MARKFLAT_WRITE_KEYS\n");
                exit(1);
            }
            $config = ["data_dir" => "@DATA@", "api" => ["read_key" => strtolower(trim((string) getenv("READ_KEY"))), "write_keys" => $writers, "admin" => $admin]];
            echo "<?php return ", str_replace("\x27@DATA@\x27", "__DIR__.\x27/data\x27", var_export($config, true)), ";\n";
          ' > dist/config.php
          php -l dist/config.php > /dev/null
          printf '%s\n' "$HTPASSWD" > dist/.htpasswd
          # Plain http is redirected to https BEFORE any login, so the password never travels
          # unencrypted: the login is only required on https (the proxy header covers a host
          # that ends TLS in front of Apache). Check after a change: http -> 301, https -> 401.
          cat > dist/.htaccess <<EOF
          RewriteEngine On
          RewriteRule ^data(/|$) - [F,L]
          RewriteCond %{HTTPS} !=on
          RewriteCond %{HTTP:X-Forwarded-Proto} !=https
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
          <If "%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'">
            AuthType Basic
            AuthName "markflat"
            AuthUserFile ${WEBROOT%/}/.htpasswd
            Require valid-user
          </If>
          EOF

      # rclone sync makes the webroot an exact copy of dist/: files the build no longer has are
      # DELETED there. The filters keep the songs out of that: of data/ only its .htaccess is
      # synced, everything else in it is excluded, and excluded files are never deleted. The host allows file transfer only: rclone must not run commands there (shell detection, md5sum), or
      # the server drops the connection.
      - name: Sync to the server (SFTP)
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SFTP_HOST: ${{ secrets.MARKFLAT_SFTP_HOST }}
          SFTP_USER: ${{ secrets.MARKFLAT_SFTP_USER }}
          SFTP_PASS: ${{ secrets.MARKFLAT_SFTP_PASS }}
          WEBROOT: ${{ secrets.MARKFLAT_WEBROOT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          for v in SFTP_HOST SFTP_USER SFTP_PASS WEBROOT; do
            [ -n "${!v}" ] || { echo "::error::secret MARKFLAT_$v is not set"; exit 1; }
          done
          sudo apt-get -qq -y install rclone
          remote=(--sftp-host "$SFTP_HOST" --sftp-user "$SFTP_USER"
                  --sftp-pass "$(rclone obscure "$SFTP_PASS")"
                  --sftp-shell-type none --sftp-disable-hashcheck --retries 5)
          flags=(--filter '+ /data/.htaccess' --filter '- /data/**')
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          rclone sync dist/ ":sftp:$WEBROOT" "${remote[@]}" --stats-one-line -v "${flags[@]}"
